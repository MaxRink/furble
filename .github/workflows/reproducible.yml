name: Reproducible firmware builds

on:
  push:
    branches: [master]
    paths:
      - "platformio.ini"
      - "sim/platformio.ini"
      - "CMakeLists.txt"
      - "patches/**"
      - "sdkconfig.*"
      - "src/idf_component.yml"
      - "src/**"
      - "include/**"
      - "lib/**"
      - "components/**"
      - "partitions_*.csv"
      - "tools/reproducible_build.py"
      - "tools/reproducible-build.lock"
      - ".github/workflows/sim-e2e.yml"
      - ".github/workflows/power-gate.yml"
      - ".github/workflows/ui-screenshots.yml"
      - "requirements.txt"
      - ".github/workflows/reproducible.yml"
  pull_request:
    paths:
      - "platformio.ini"
      - "sim/platformio.ini"
      - "CMakeLists.txt"
      - "patches/**"
      - "sdkconfig.*"
      - "src/idf_component.yml"
      - "src/**"
      - "include/**"
      - "lib/**"
      - "components/**"
      - "partitions_*.csv"
      - "tools/reproducible_build.py"
      - "tools/reproducible-build.lock"
      - ".github/workflows/sim-e2e.yml"
      - ".github/workflows/power-gate.yml"
      - ".github/workflows/ui-screenshots.yml"
      - "requirements.txt"
      - ".github/workflows/reproducible.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - m5stick-c
          - m5stick-c-plus
          - m5stack-core
          - m5stack-core2
          - m5stick-s3
          - esp32-s3-headless

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache PlatformIO packages and platforms
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-repro-platformio-${{ hashFiles('platformio.ini', 'requirements.txt', 'src/idf_component.yml', 'patches/**', 'tools/reproducible-build.lock') }}
          restore-keys: |
            ${{ runner.os }}-repro-platformio-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt

      - name: Test framework patch isolation
        run: |
          python3 patches/test_ble_gap_patch.py
          python3 patches/test_reproducible.py
          python3 patches/test_repro_prefix_map.py
          python3 tests/test_reproducible_paths.py

      - name: Compare clean builds
        run: >-
          python3 tools/reproducible_build.py
          --env "${{ matrix.environment }}" --negative-version
