name: UI screenshots

# Keep this workflow focused on files that can change the rendered UI. The
# sdkconfig files select LVGL fonts and themes, and the generator is part of
# that configuration path.
'on':
  pull_request:
    paths:
      - 'src/FurbleUI*'
      - 'src/FurbleGPS.cpp'
      - 'src/FurbleSettings.cpp'
      - 'src/FurbleSpinValue.cpp'
      - 'src/FurbleCalibrate.cpp'
      - 'include/FurbleUI.h'
      - 'include/FurbleGPS.h'
      - 'include/FurbleSettings.h'
      - 'include/FurbleSpinValue.h'
      - 'include/FurbleCalibrate.h'
      - 'components/icons/**'
      - 'sim/**'
      - 'sdkconfig.*'
      - 'tools/gen_lv_conf.py'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-screenshots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No restore-keys on purpose: the fetch step below skips a dependency
      # when its directory exists, so a stale prefix match could pin an old
      # version. An exact key miss just re-clones, which takes seconds.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: sim/.pio
          key: ${{ runner.os }}-ui-screenshots-${{ hashFiles('sim/platformio.ini', '.github/workflows/ui-screenshots.yml') }}

      - name: Install SDL2, Clang, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libsdl2-dev xvfb

      # Runs 32061201722 and 32033121941 failed because `platformio pkg
      # install -e sim` silently skipped the owner-less M5GFX and M5Unified
      # lib_deps specs (only lvgl and TinyGPSPlus installed) and exited zero,
      # so build.sh found an empty libdeps tree. build.sh never invokes
      # PlatformIO; it only needs the four source trees. Pinned shallow git
      # clones are faster (no PlatformIO pip install, no native platform or
      # scons download) and fail loudly when a pin is wrong. Keep these pins
      # in sync with sim/platformio.ini and src/idf_component.yml.
      - name: Fetch simulator dependencies
        env:
          DEPS: ${{ github.workspace }}/sim/.pio/libdeps/sim
        run: |
          clone_tag() {
            test -d "$DEPS/$3" || \
              git clone --depth 1 --branch "$2" "https://github.com/$1" "$DEPS/$3"
          }
          mkdir -p "$DEPS"
          clone_tag m5stack/M5GFX 0.2.27 M5GFX
          clone_tag m5stack/M5Unified 0.2.20 M5Unified
          clone_tag lvgl/lvgl v9.4.0 lvgl
          if [ ! -d "$DEPS/TinyGPSPlus" ]; then
            git init "$DEPS/TinyGPSPlus"
            git -C "$DEPS/TinyGPSPlus" fetch --depth 1 \
              https://github.com/gkoh/TinyGPSPlus \
              92ac8c21b8179201c2c8c534e46af3320b76d3e7
            git -C "$DEPS/TinyGPSPlus" checkout --detach FETCH_HEAD
          fi

      - name: Generate LVGL configuration
        run: python3 tools/gen_lv_conf.py sdkconfig.m5stick-s3 sim/lv_conf.h

      - name: Build simulator
        env:
          FURBLE_DEP_ROOT: ${{ github.workspace }}/sim/.pio/libdeps/sim
          FURBLE_LVGL_DIR: ${{ github.workspace }}/sim/.pio/libdeps/sim/lvgl
        run: sh sim/build.sh

      - name: Capture UI screenshots
        env:
          FURBLE_SIM_PREFS: ${{ runner.temp }}/furble-sim-prefs.bin
        run: |
          mkdir -p "$RUNNER_TEMP/ui-screenshots"
          # Panel_sdl needs a display-backed GL surface for pixel readback on
          # Linux. The SDL dummy video driver does not provide that surface.
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            env \
              SDL_VIDEODRIVER=x11 \
              SDL_AUDIODRIVER=dummy \
              LIBGL_ALWAYS_SOFTWARE=1 \
              ./sim/build/furble-sim \
              --script sim/scripts/ui-screenshots.txt \
              --out "$RUNNER_TEMP/ui-screenshots"

      - name: Write screenshot list and job summary
        shell: bash
        run: |
          names="$(find "$RUNNER_TEMP/ui-screenshots" -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort)"
          test -n "$names"
          {
            echo 'UI_SCREEN_NAMES<<EOF'
            echo "$names"
            echo EOF
          } >> "$GITHUB_ENV"
          {
            echo '## UI screenshots'
            echo
            echo 'The simulator currently models the M5StickS3 135x240 board class.'
            echo
            echo '| Screen | Board class | PNG |'
            echo '| --- | --- | --- |'
            while IFS= read -r name; do
              screen="${name#m5stick-s3-}"
              screen="${screen%.png}"
              echo "| \`$screen\` | \`m5stick-s3 135x240\` | \`$name\` |"
            done <<< "$names"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          if-no-files-found: error

      # The summary and artifact are available to PR reviewers without a
      # write-capable token. This keeps fork pull requests read-only.
