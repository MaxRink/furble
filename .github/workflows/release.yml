name: Release furble

on:
  release:
    types: [published]

env:
  FURBLE_VERSION: ${{ github.ref_name }}+${{ github.run_attempt }}
  FURBLE_TEST: "0"

jobs:
  build:

    strategy:
      matrix:
        platform:
          - m5stack-core
          - m5stack-core2
          - m5stick-c
          - m5stick-c-plus
          - m5stick-s3
        # Empty variant is the release build. The -debug variant builds the
        # matching PlatformIO *-debug env, which enables FURBLE_CONSOLE. Debug
        # envs share the release sdkconfig, so flash offsets are identical.
        variant:
          - ""
          - "-debug"

    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FIRMWARE_NAME: furble-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}+${{ github.run_attempt }}.bin
      BOOTLOADER_NAME: furble-bootloader-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}+${{ github.run_attempt }}.bin
      PARTITIONS_NAME: furble-partitions-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}+${{ github.run_attempt }}.bin
      OTA_DATA_NAME: furble-ota_data_initial-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}+${{ github.run_attempt }}.bin

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure for test release
        run: |
          echo "FURBLE_TEST=1" >> $GITHUB_ENV
        if: startsWith(github.ref_name, 'vTEST')

      - name: Build furble (${{ matrix.platform }}${{ matrix.variant }})
        run: platformio run -e ${{ matrix.platform }}${{ matrix.variant }}

      - name: Rename binaries (${{ matrix.platform }}${{ matrix.variant }})
        run: |
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/firmware.bin $FIRMWARE_NAME
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/bootloader.bin $BOOTLOADER_NAME
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/partitions.bin $PARTITIONS_NAME
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/ota_data_initial.bin $OTA_DATA_NAME

      - name: Generate manifest (${{ matrix.platform }}${{ matrix.variant }})
        working-directory: ./web-installer
        env:
          VERSION: ${{ env.FURBLE_VERSION }}
          # PLATFORM carries the -debug suffix for debug builds. The suffix
          # flows straight into the binary paths in manifest.tmpl, while the
          # flash offsets stay shared with the release path.
          RELEASE: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}${{ matrix.variant }}
        run: |
          python generate-manifest.py > ../manifest_${{ matrix.platform }}${{ matrix.variant }}.json

      - name: Upload artifacts (${{ matrix.platform }}${{ matrix.variant }})
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FIRMWARE_NAME }}
          path: |
            ${{ env.FIRMWARE_NAME }}
            ${{ env.BOOTLOADER_NAME }}
            ${{ env.PARTITIONS_NAME }}
            ${{ env.OTA_DATA_NAME }}
            manifest_${{ matrix.platform }}${{ matrix.variant }}.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Generate release artifacts

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Generate release hashes
        run: |
          ls -lR
          sha256sum furble-*.bin > sha256sum.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            furble-*.bin
            manifest_*.json
            sha256sum.txt

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    name: Deploy to Cloudflare Pages

    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Assemble assets
        run: |
          mkdir -p deploy
          cp web-installer/index.html deploy/index.html
          mv manifest*.json deploy/.
          mkdir -p deploy/firmware
          mv furble-*.bin deploy/firmware

      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=furble-web-installer --branch=${{ !github.event.release.prerelease && 'main' || 'HEAD' }}

      - name: Update release notes
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          body: |

            **Deployment URL**: ${{ steps.publish.outputs.deployment-url }}
