name: Release furble

on:
  release:
    types: [published]

env:
  FURBLE_VERSION: ${{ github.ref_name }}
  FURBLE_TEST: "0"

jobs:
  build:

    strategy:
      matrix:
        platform:
          - m5stack-core
          - m5stack-core2
          - m5stick-c
          - m5stick-c-plus
          - m5stick-s3
        # Empty variant is the release build. The -debug variant builds the
        # matching PlatformIO *-debug env, which enables FURBLE_CONSOLE. Debug
        # envs share the release sdkconfig, so flash offsets are identical.
        variant:
          - ""
          - "-debug"

    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FIRMWARE_NAME: furble-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}.bin
      BOOTLOADER_NAME: furble-bootloader-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}.bin
      PARTITIONS_NAME: furble-partitions-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}.bin
      OTA_DATA_NAME: furble-ota_data_initial-${{ matrix.platform }}${{ matrix.variant }}-${{ github.ref_name }}.bin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure for test release
        run: |
          echo "FURBLE_TEST=1" >> $GITHUB_ENV
        if: startsWith(github.ref_name, 'vTEST')

      - name: Build furble (${{ matrix.platform }}${{ matrix.variant }})
        run: platformio run -e ${{ matrix.platform }}${{ matrix.variant }}

      - name: Rename binaries (${{ matrix.platform }}${{ matrix.variant }})
        run: |
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/firmware.bin $FIRMWARE_NAME
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/bootloader.bin $BOOTLOADER_NAME
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/partitions.bin $PARTITIONS_NAME
          mv .pio/build/${{ matrix.platform }}${{ matrix.variant }}/ota_data_initial.bin $OTA_DATA_NAME

      - name: Generate manifest (${{ matrix.platform }}${{ matrix.variant }})
        working-directory: ./web-installer
        env:
          VERSION: ${{ env.FURBLE_VERSION }}
          # PLATFORM carries the -debug suffix for debug builds. The suffix
          # flows straight into the binary paths in manifest.tmpl, while the
          # flash offsets stay shared with the release path.
          RELEASE: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}${{ matrix.variant }}
        run: |
          python generate-manifest.py > ../manifest_${{ matrix.platform }}${{ matrix.variant }}.json

      - name: Upload artifacts (${{ matrix.platform }}${{ matrix.variant }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.FIRMWARE_NAME }}
          path: |
            ${{ env.FIRMWARE_NAME }}
            ${{ env.BOOTLOADER_NAME }}
            ${{ env.PARTITIONS_NAME }}
            ${{ env.OTA_DATA_NAME }}
            manifest_${{ matrix.platform }}${{ matrix.variant }}.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Generate release artifacts

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate release hashes
        run: |
          ls -lR
          sha256sum furble-*.bin > sha256sum.txt

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            furble-*.bin
            manifest_*.json
            sha256sum.txt

  # The web flasher is deployed by pages.yml to GitHub Pages
  # (https://maxrink.github.io/furble/). That workflow runs on the same v* tag
  # this release publishes and self-hosts the firmware, so the fork owns its
  # installer end to end. The previous Cloudflare Pages deploy was dropped: it
  # targeted the project name furble-web-installer, which belongs to the
  # upstream gkoh deployment, and it needed CLOUDFLARE_* secrets the fork does
  # not set.
