name: Pre-review scanners

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'tests/**'
      - 'tools/**'
      - 'sim/**'
      - 'docs/**'
      - 'plans/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'platformio.ini'
      - 'sdkconfig*'
  workflow_dispatch:
    inputs:
      base:
        description: 'Git base revision for the scanners'
        required: false
        default: 'origin/master'
        type: string

permissions:
  contents: read

# A newer run for the same ref supersedes the previous one, so a stale pull
# request run stops instead of queueing. Push to master and manual dispatch
# keep cancel-in-progress false, so an in-flight run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scanners:
    name: Diff, settings, and C++ scans
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Fetch the manual-dispatch base
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin master:refs/remotes/origin/master

      - name: Install CI checker requirements
        run: python3 -m pip install -r .github/workflows/ci-checker-requirements.txt

      - name: Install clang-format
        run: python3 -m pip install -r .github/workflows/clang-format-requirements.txt

      # The module list lives in tools/pre_review.py and is discovered from
      # tests/, so a new scanner test cannot be left out of the gate here while
      # the Python tooling job runs it. This step was a second hand-written list
      # and had already fallen behind the scanners it was meant to cover.
      - name: Scanner unit tests
        run: python3 tools/pre_review.py --unit-only

      - name: Run pre-review scanners
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/master' }}
        run: python3 tools/pre_review.py --base "$BASE_SHA" --skip-unit
