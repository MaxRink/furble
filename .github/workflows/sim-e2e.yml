name: Simulator end-to-end

# Drive the real UI and Control against the fake camera through scripted
# scenarios and assert app-state outcomes. This job stays separate from the
# ui-screenshots job on purpose: it asserts control-flow state, never reads back
# pixels, so it avoids the software-GL readback path that makes screenshots
# flaky. The SDL dummy video driver is enough, so no Xvfb is required.
'on':
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/furble/**'
      - 'lib/preferences/**'
      - 'lib/blowfish/**'
      - 'lib/testing/**'
      - 'components/icons/**'
      - 'sim/**'
      - 'tests/corpus/**'
      - 'sdkconfig.*'
      - 'tools/gen_lv_conf.py'
      - 'tools/check_sim_scenarios.py'
      - 'sim/scenarios/manifest.json'
      - '.github/workflows/sim-e2e.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/furble/**'
      - 'lib/preferences/**'
      - 'lib/blowfish/**'
      - 'lib/testing/**'
      - 'components/icons/**'
      - 'sim/**'
      - 'tests/corpus/**'
      - 'sdkconfig.*'
      - 'tools/gen_lv_conf.py'
      - 'tools/check_sim_scenarios.py'
      - 'sim/scenarios/manifest.json'
      - '.github/workflows/sim-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No restore-keys on purpose: the fetch step below skips a dependency
      # when its directory exists, so a stale prefix match could pin an old
      # version. An exact key miss just re-clones, which takes seconds.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: sim/.pio
          key: ${{ runner.os }}-sim-e2e-${{ hashFiles('sim/platformio.ini', '.github/workflows/sim-e2e.yml') }}

      - name: Install SDL2 and Clang
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libsdl2-dev

      # build.sh never invokes PlatformIO; it only needs the four source trees.
      # Pinned shallow git clones are faster and fail loudly when a pin is
      # wrong. Keep these pins in sync with sim/platformio.ini and
      # src/idf_component.yml and the ui-screenshots workflow.
      - name: Fetch simulator dependencies
        env:
          DEPS: ${{ github.workspace }}/sim/.pio/libdeps/sim
        run: |
          clone_tag() {
            test -d "$DEPS/$3" || \
              git clone --depth 1 --branch "$2" "https://github.com/$1" "$DEPS/$3"
          }
          mkdir -p "$DEPS"
          clone_tag m5stack/M5GFX 0.2.27 M5GFX
          clone_tag m5stack/M5Unified 0.2.20 M5Unified
          clone_tag lvgl/lvgl v9.4.0 lvgl
          if [ ! -d "$DEPS/TinyGPSPlus" ]; then
            git init "$DEPS/TinyGPSPlus"
            git -C "$DEPS/TinyGPSPlus" fetch --depth 1 \
              https://github.com/gkoh/TinyGPSPlus \
              92ac8c21b8179201c2c8c534e46af3320b76d3e7
            git -C "$DEPS/TinyGPSPlus" checkout --detach FETCH_HEAD
          fi

      - name: Generate LVGL configuration
        run: python3 tools/gen_lv_conf.py sdkconfig.m5stick-s3 sim/lv_conf.h

      - name: Check simulator scenario ownership
        run: python3 tools/check_sim_scenarios.py

      - name: Build simulator
        env:
          FURBLE_DEP_ROOT: ${{ github.workspace }}/sim/.pio/libdeps/sim
          FURBLE_LVGL_DIR: ${{ github.workspace }}/sim/.pio/libdeps/sim/lvgl
        run: sh sim/build.sh

      # The manifest selects the certified scenarios per board, so a scenario
      # scoped to one board needs no step of its own. stick-notouch-layout-135,
      # stick-notouch-layout-80 and core-notouch-layout are each certified for
      # one board: they seed no_touch so they measure the physical-button layout
      # those boards actually ship, which is 26 px shorter than the touch layout
      # every other scenario measures. This step runs the 135x240 one; the
      # alternate-board step below runs the other two.
      - name: Run certified bug-hunt scenarios (M5StickS3)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FURBLE_SIM_IR: 1
          FURBLE_SIM_FEEDBACK: 1
          FURBLE_SIM_SD: 1
        run: |
          if ! scenarios=$(python3 tools/check_sim_scenarios.py \
              --list-certified --suite bughunt --board m5stick-s3); then
            echo "Failed to select certified M5StickS3 bug-hunt scenarios." >&2
            exit 1
          fi
          if [ -z "$scenarios" ]; then
            echo "No certified M5StickS3 bug-hunt scenarios selected." >&2
            exit 1
          fi
          for scenario in $scenarios; do
            sim/build/furble-sim --script "$scenario"
          done

      # The GPS decoder runs on a host thread while UI timers query its status.
      # Keep one focused ThreadSanitizer scenario in CI so parser ownership
      # regressions fail deterministically instead of surfacing as rare SDL
      # crashes in unrelated page scenarios.
      - name: Build GPS concurrency sanitizer
        env:
          FURBLE_DEP_ROOT: ${{ github.workspace }}/sim/.pio/libdeps/sim
          FURBLE_LVGL_DIR: ${{ github.workspace }}/sim/.pio/libdeps/sim/lvgl
          FURBLE_SIM_BUILD_DIR: ${{ github.workspace }}/sim/build-tsan
          FURBLE_SIM_SANITIZE: thread
        run: sh sim/build.sh

      - name: Assert GPS task ownership under ThreadSanitizer
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/sim/tsan.supp
        run: >-
          sim/build-tsan/furble-sim
          --script sim/scenarios/e2e/gps-concurrent-pages.txt

      - name: Run end-to-end scenarios
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: sh sim/scripts/run-e2e.sh

      # Keep the retained M5PM1 watchdog contract explicit. This runs against
      # the freshly built default M5StickS3 binary, rather than relying only on
      # the broad scenario glob (or a stale developer binary).
      - name: Assert M5StickS3 PM1 watchdog boundaries
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: sh sim/scripts/run-watchdog.sh

      - name: Stress asynchronous GPS task convergence
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FURBLE_ASYNC_STRESS_ROUNDS: 5
        run: sh sim/scripts/run-async-stress.sh

      - name: Reject malformed scenario values
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: sh sim/scripts/run-invalid.sh

      # Build a second simulator for the M5StickC 80x160 panel. Its own build
      # dir keeps the 135x240 binary above intact. The full overflow sweep runs
      # after the 320x240 build below, so all three representative geometries
      # share one deterministic page list.
      - name: Build 80x160 (M5StickC) simulator
        env:
          FURBLE_DEP_ROOT: ${{ github.workspace }}/sim/.pio/libdeps/sim
          FURBLE_LVGL_DIR: ${{ github.workspace }}/sim/.pio/libdeps/sim/lvgl
          FURBLE_SIM_BUILD_DIR: ${{ github.workspace }}/sim/build-stickc
          FURBLE_SIM_FURBLE_BOARD: FURBLE_M5STICKC
          FURBLE_SIM_M5GFX_BOARD: board_M5StickC
        run: sh sim/build.sh

      # Assert the compact pages fit the panel at alternate text sizes.
      # text-size-overflow-large.txt and
      # The spirit level page auto-rotates and resizes its bullseye per panel, so
      # its layout must be checked on the widest panel too. Build the 320x240
      # M5Stack Core simulator in its own build dir, leaving the 135x240 and
      # 80x160 binaries above intact.
      - name: Build 320x240 (M5Stack Core) simulator
        env:
          FURBLE_DEP_ROOT: ${{ github.workspace }}/sim/.pio/libdeps/sim
          FURBLE_LVGL_DIR: ${{ github.workspace }}/sim/.pio/libdeps/sim/lvgl
          FURBLE_SIM_BUILD_DIR: ${{ github.workspace }}/sim/build-core
          FURBLE_SIM_FURBLE_BOARD: FURBLE_M5COREX
          FURBLE_SIM_M5GFX_BOARD: board_M5Stack
        run: sh sim/build.sh

      - name: Run certified bug-hunt scenarios on alternate boards
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FURBLE_SIM_IR: 1
          FURBLE_SIM_FEEDBACK: 1
          FURBLE_SIM_SD: 1
        run: |
          for board_binary in \
            "m5stick-c:sim/build-stickc/furble-sim" \
            "m5stack-core:sim/build-core/furble-sim"; do
            board=${board_binary%%:*}
            binary=${board_binary#*:}
            if ! scenarios=$(python3 tools/check_sim_scenarios.py \
                --list-certified --suite bughunt --board "$board"); then
              echo "Failed to select certified $board bug-hunt scenarios." >&2
              exit 1
            fi
            if [ -z "$scenarios" ]; then
              echo "No certified $board bug-hunt scenarios selected." >&2
              exit 1
            fi
            for scenario in $scenarios; do
              "$binary" --script "$scenario"
            done
          done

      - name: Run certified end-to-end scenarios on alternate boards
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          FURBLE_SIM_BOARD_ID=m5stick-c \
            FURBLE_SIM_BIN=sim/build-stickc/furble-sim \
            sh sim/scripts/run-e2e.sh
          FURBLE_SIM_BOARD_ID=m5stack-core \
            FURBLE_SIM_BIN=sim/build-core/furble-sim \
            sh sim/scripts/run-e2e.sh

      # Prove the IMU spirit level page (PR #28) is sim-verified on every panel
      # class. level-overflow.txt injects a tilt sweep through the sim IMU seam
      # and asserts the bubble tracks the tilt, the page renders and nothing
      # overflows at 80x160, 135x240 and 320x240. imu-diagnostics.txt asserts the
      # live IMU readout renders the injected sample, and redraw-steady.txt holds
      # the level and connected pages at a fixed state and asserts the
      # invalidation count stays low, catching a per-tick redraw storm. These also
      # run on the 135x240 binary through run-e2e.sh above; here they repeat on
      # the narrow and wide panels where the level layout and rotation differ.
      - name: Assert IMU level and redraw across panels (80x160 and 320x240)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          SCENARIOS="
          ${{ github.workspace }}/sim/scenarios/e2e/level-overflow.txt
          ${{ github.workspace }}/sim/scenarios/e2e/imu-diagnostics.txt
          ${{ github.workspace }}/sim/scenarios/e2e/redraw-steady.txt
          "
          for scenario in $SCENARIOS; do
            name=$(basename "$scenario" .txt)
            echo "=== 80x160 (M5StickC): $name ==="
            "${{ github.workspace }}/sim/build-stickc/furble-sim" --script "$scenario"
            echo "=== 320x240 (M5Stack Core): $name ==="
            "${{ github.workspace }}/sim/build-core/furble-sim" --script "$scenario"
          done

      # Assert the compact pages fit the panel. overflow-sweep.txt runs at the
      # default Normal font; text-size-overflow-large.txt and
      # text-size-overflow-small.txt repeat the compact-page fit assertions with
      # the global Text size setting seeded to Large and Small, so the theme font
      # scaling is layout-verified too. The text-size scenarios stay scoped to
      # the two narrow non-touch panels because the Core intentionally scrolls
      # more settings content at its larger font.
      - name: Assert narrow-panel layout fits (135x240 and 80x160)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          SCENARIOS="
          ${{ github.workspace }}/sim/scenarios/bughunt/text-size-overflow-large.txt
          ${{ github.workspace }}/sim/scenarios/bughunt/text-size-overflow-small.txt
          "
          for scenario in $SCENARIOS; do
            name=$(basename "$scenario" .txt)
            echo "=== 135x240 (M5StickS3): $name ==="
            "${{ github.workspace }}/sim/build/furble-sim" --script "$scenario"
            echo "=== 80x160 (M5StickC): $name ==="
            "${{ github.workspace }}/sim/build-stickc/furble-sim" --script "$scenario"
          done

      # Assert the 80x160 M5StickC text size gate: a fresh device defaults to
      # Small, the roller drops Large and offers only two sizes, and a Large
      # value carried in from another board clamps to Normal at render time.
      # These are scoped to the 80x160 binary because the default and option set
      # differ from every other board; text-size-gate.txt covers the Normal
      # default and all three options on the 135x240 binary via run-e2e.sh.
      - name: Assert 80x160 text size gate (M5StickC)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          for scenario in \
            text-size-gate-stickc \
            text-size-clamp-stickc; do
            echo "=== 80x160 (M5StickC): $scenario ==="
            "${{ github.workspace }}/sim/build-stickc/furble-sim" \
              --script "${{ github.workspace }}/sim/scenarios/bughunt/$scenario.txt"
          done

      # Complete modeled-page and layout matrix. Keep one scenario for all
      # panel classes so route reachability, optional capability pages and
      # scroll-end behavior cannot drift between board jobs. The scenario
      # intentionally enables IR, feedback and SD to cover the gated pages.
      - name: Assert modeled-page matrix (135x240, 80x160, 320x240)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FURBLE_SIM_IR: 1
          FURBLE_SIM_FEEDBACK: 1
          FURBLE_SIM_SD: 1
        run: |
          for build in build build-stickc build-core; do
            echo "=== $build: page-matrix ==="
            "${{ github.workspace }}/sim/$build/furble-sim" \
              --script "${{ github.workspace }}/sim/scenarios/bughunt/page-matrix.txt"
          done

      # Overflow audit for every reachable page. The page matrix above owns
      # route identity and scroll-end checks; this sweep owns the expected
      # compact-page fit assertions and prints overflow diagnostics for every
      # intentional-scroll route. Keep the same scenario across all three
      # panel classes so a geometry-specific defect cannot hide in one job.
      - name: Sweep overflow on every page (135x240, 80x160, 320x240)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FURBLE_SIM_IR: 1
          FURBLE_SIM_FEEDBACK: 1
          FURBLE_SIM_SD: 1
        run: |
          for build in build build-stickc build-core; do
            echo "=== $build: overflow-sweep ==="
            "${{ github.workspace }}/sim/$build/furble-sim" \
              --script "${{ github.workspace }}/sim/scenarios/bughunt/overflow-sweep.txt"
          done

      # Connection-state coverage on every panel width: a mid-session drop must be
      # surfaced on every page reachable during a connected session
      # (connstate-page-sweep), and the status row must stay stable across the
      # disconnected / connected / reconnecting / GPS matrix (statusbar-stability).
      # Both also run on the default 135x240 binary through run-e2e.sh above; here
      # they run on the 80x160 and 320x240 binaries too, where the panel layouts
      # differ. WILL_FAIL lines (`xassert`) keep the run green while tracking
      # the bulb-page reconnect banner and the exact battery anchor. The red BT
      # icon is a hard guard.
      - name: Assert connection-state coverage (135x240, 80x160, 320x240)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          for scenario in connstate-page-sweep statusbar-stability; do
            for build in build build-stickc build-core; do
              echo "=== $build: $scenario ==="
              "${{ github.workspace }}/sim/$build/furble-sim" \
                --script "${{ github.workspace }}/sim/scenarios/e2e/$scenario.txt"
            done
          done

      # Seeded UI fuzzer. Feeds deterministic randomized button, navigation,
      # settings and modal event streams into the real UI and checks the
      # crash-free, stale-focus, stacked-modal, narrow-panel-overflow,
      # timer-leak and navigation-trap invariants after every event. The pinned
      # seeds keep the same event streams reproducible, so a UI change that
      # introduces any of those flips the matching seed to a non-zero exit. Run
      # on all three modeled panel binaries; the 80x160 panel is where a layout
      # overflow regression bites first. This keeps timing and navigation
      # findings from being panel-specific.
      # See plans/105-ui-fuzzing.md.
      - name: Fuzz the UI (135x240, 80x160, and 320x240)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FURBLE_FUZZ_STEPS: 600
        run: |
          echo "=== 135x240 (M5StickS3) ==="
          FURBLE_SIM_BIN="${{ github.workspace }}/sim/build/furble-sim" \
            sh sim/scripts/run-fuzz.sh
          echo "=== build-stickc ==="
          FURBLE_SIM_BIN="${{ github.workspace }}/sim/build-stickc/furble-sim" \
            sh sim/scripts/run-fuzz.sh
          echo "=== build-core ==="
          # Seed 3 was pinned expected-fail on 320x240 for a deterministic
          # layout overflow on the intervalometer settings page (step 447,
          # page=timer). It is promoted back into the guarded set because it
          # passes here on three of three runs with zero findings.
          #
          # State this precisely: the page was not fixed. The plan 166
          # scheduler fairness change alters how far the control task gets per
          # UI slice, so the event stream reaches a different page at step 447
          # and no longer walks into the overflow. The underlying 320x240
          # layout bug is still there and still uncovered, because EXACT_BOARDS
          # in tools/check_sim_scenarios.py restricts text-size-overflow-large
          # to m5stick-s3 and m5stick-c. Closing that gap belongs to a layout PR
          # that can verify on the board. See plans/161-sim-real-control.md and
          # plans/166-sim-teardown-livelock.md.
          FURBLE_SIM_BIN="${{ github.workspace }}/sim/build-core/furble-sim" \
            sh sim/scripts/run-fuzz.sh
