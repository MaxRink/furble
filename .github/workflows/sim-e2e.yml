name: Simulator end-to-end

# Drive the real UI and Control against the fake camera through scripted
# scenarios and assert app-state outcomes. This job stays separate from the
# ui-screenshots job on purpose: it asserts control-flow state, never reads back
# pixels, so it avoids the software-GL readback path that makes screenshots
# flaky. The SDL dummy video driver is enough, so no Xvfb is required.
'on':
  pull_request:
    paths:
      - 'src/FurbleUI*'
      - 'src/FurbleGPS.cpp'
      - 'src/FurbleSettings.cpp'
      - 'src/FurbleSpinValue.cpp'
      - 'src/FurbleCalibrate.cpp'
      - 'src/FurblePower.cpp'
      - 'src/FurbleCompanionService.cpp'
      - 'include/FurbleUI.h'
      - 'include/FurbleControl.h'
      - 'include/FurbleSettings.h'
      - 'components/icons/**'
      - 'sim/**'
      - 'sdkconfig.*'
      - 'tools/gen_lv_conf.py'
      - '.github/workflows/sim-e2e.yml'

permissions:
  contents: read

jobs:
  sim-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # No restore-keys on purpose: the fetch step below skips a dependency
      # when its directory exists, so a stale prefix match could pin an old
      # version. An exact key miss just re-clones, which takes seconds.
      - uses: actions/cache@v5
        with:
          path: sim/.pio
          key: ${{ runner.os }}-sim-e2e-${{ hashFiles('sim/platformio.ini', '.github/workflows/sim-e2e.yml') }}

      - name: Install SDL2 and Clang
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang libsdl2-dev

      # build.sh never invokes PlatformIO; it only needs the four source trees.
      # Pinned shallow git clones are faster and fail loudly when a pin is
      # wrong. Keep these pins in sync with sim/platformio.ini and
      # src/idf_component.yml and the ui-screenshots workflow.
      - name: Fetch simulator dependencies
        env:
          DEPS: ${{ github.workspace }}/sim/.pio/libdeps/sim
        run: |
          clone_tag() {
            test -d "$DEPS/$3" || \
              git clone --depth 1 --branch "$2" "https://github.com/$1" "$DEPS/$3"
          }
          mkdir -p "$DEPS"
          clone_tag m5stack/M5GFX 0.2.19 M5GFX
          clone_tag m5stack/M5Unified 0.2.13 M5Unified
          clone_tag lvgl/lvgl v9.4.0 lvgl
          if [ ! -d "$DEPS/TinyGPSPlus" ]; then
            git init "$DEPS/TinyGPSPlus"
            git -C "$DEPS/TinyGPSPlus" fetch --depth 1 \
              https://github.com/gkoh/TinyGPSPlus \
              92ac8c21b8179201c2c8c534e46af3320b76d3e7
            git -C "$DEPS/TinyGPSPlus" checkout --detach FETCH_HEAD
          fi

      - name: Generate LVGL configuration
        run: python3 tools/gen_lv_conf.py sdkconfig.m5stick-s3 sim/lv_conf.h

      - name: Build simulator
        env:
          FURBLE_DEP_ROOT: ${{ github.workspace }}/sim/.pio/libdeps/sim
          FURBLE_LVGL_DIR: ${{ github.workspace }}/sim/.pio/libdeps/sim/lvgl
        run: sh sim/build.sh

      - name: Run end-to-end scenarios
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: sh sim/scripts/run-e2e.sh

      # The layout overflow the sweep asserts against only happens on the
      # shortest panel, so build a second simulator for the M5StickC 80x160
      # panel. Its own build dir keeps the 135x240 binary above intact.
      - name: Build 80x160 (M5StickC) simulator
        env:
          FURBLE_DEP_ROOT: ${{ github.workspace }}/sim/.pio/libdeps/sim
          FURBLE_LVGL_DIR: ${{ github.workspace }}/sim/.pio/libdeps/sim/lvgl
          FURBLE_SIM_BUILD_DIR: ${{ github.workspace }}/sim/build-stickc
          FURBLE_SIM_FURBLE_BOARD: FURBLE_M5STICKC
          FURBLE_SIM_M5GFX_BOARD: board_M5StickC
        run: sh sim/build.sh

      # Assert the compact pages fit the panel. overflow-sweep.txt runs at the
      # default Normal font; text-size-overflow-large.txt and
      # text-size-overflow-small.txt repeat the compact-page fit assertions with
      # the global Text size setting seeded to Large and Small, so the theme font
      # scaling is layout-verified too. Run all three on the 135x240 binary from
      # above and on the 80x160 binary. Both panels must pass, and the 80x160 run
      # is the one with teeth: it fails if the narrow-panel layout regresses so
      # the home menu or timer page overflows again at any font size. The
      # text-size scenarios are scoped to these two narrow non-touch panels on
      # purpose. On the 320x240 M5Stack Core, which packs a larger font into the
      # same 240 px height, some settings pages already scroll by design at
      # Normal, so a compact-fit assertion does not hold there.
      - name: Assert narrow-panel layout fits (135x240 and 80x160)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          SCENARIOS="
          ${{ github.workspace }}/sim/scenarios/bughunt/overflow-sweep.txt
          ${{ github.workspace }}/sim/scenarios/bughunt/text-size-overflow-large.txt
          ${{ github.workspace }}/sim/scenarios/bughunt/text-size-overflow-small.txt
          "
          for scenario in $SCENARIOS; do
            name=$(basename "$scenario" .txt)
            echo "=== 135x240 (M5StickS3): $name ==="
            "${{ github.workspace }}/sim/build/furble-sim" --script "$scenario"
            echo "=== 80x160 (M5StickC): $name ==="
            "${{ github.workspace }}/sim/build-stickc/furble-sim" --script "$scenario"
          done
