name: PlatformIO CI

on:
  push:
    branches:
      - master
      - combined
  pull_request:
    paths-ignore:
      - 'companion/android/**'
      - 'plans/**'
      - 'web-installer/**'
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect firmware changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual run is an explicit request for the complete matrix. It
            # has no meaningful base SHA, so path filtering is not applicable.
            firmware_changed=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
            else
              base_sha="$PUSH_BEFORE_SHA"
            fi
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git hash-object -t tree /dev/null)"
            fi

            firmware_changed=false
            changed_paths="$(git diff --name-only --no-renames "$base_sha" "$CURRENT_SHA")"
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                companion/android/*|plans/*|web-installer/*|README.md|*.md)
                  ;;
                *)
                  firmware_changed=true
                  break
                  ;;
              esac
            done <<< "$changed_paths"
          fi

          echo "Firmware paths changed: $firmware_changed"
          echo "firmware=$firmware_changed" >> "$GITHUB_OUTPUT"

  host_camera:
    name: Host harness and Ethernet lifecycle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check portability contract
        run: python3 tools/check_portability_inventory.py --check

      - name: Configure host harness
        run: cmake -S tests/host -B "$RUNNER_TEMP/furble-host-build"

      - name: Build host harness
        run: cmake --build "$RUNNER_TEMP/furble-host-build" --parallel 2

      - name: Run host harness, including Ethernet lifecycle
        run: ctest --test-dir "$RUNNER_TEMP/furble-host-build" --output-on-failure

  python-tools:
    name: Python tooling tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run Python tooling tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  release-transport-gate:
    name: Release transport gate
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject rig transport in release environments
        shell: bash
        run: |
          set -euo pipefail
          # The rig transport is simulator only. Its PlatformIO environment lives
          # in sim/platformio.ini, so FURBLE_RIG must never appear anywhere in the
          # release platformio.ini. Grepping the whole file also catches a define
          # placed in the shared [env] block or in any base section that a release
          # environment inherits through 'extends', which a per-[env:X] section
          # scan would miss.
          if grep -n 'FURBLE_RIG' platformio.ini; then
            echo "FURBLE_RIG must not appear in the release platformio.ini" >&2
            exit 1
          fi

      - name: Require rig transport to bind loopback only
        shell: bash
        run: |
          set -euo pipefail
          transport="sim/CompanionRigTransport.cpp"
          # The sim rig listens on a TCP socket. It must only ever bind the
          # loopback address so the rig is never reachable off the host. Fail on
          # any wildcard bind (INADDR_ANY, 0.0.0.0, in6addr_any, "::") and require
          # the 127.0.0.1 loopback literal to be present as the bind target.
          if grep -nE 'INADDR_ANY|in6addr_any|0\.0\.0\.0|"::"' "$transport"; then
            echo "Rig transport must not bind a wildcard address" >&2
            exit 1
          fi
          if ! grep -q '"127\.0\.0\.1"' "$transport"; then
            echo "Rig transport must bind the 127.0.0.1 loopback literal" >&2
            exit 1
          fi

  format:
    name: clang-format
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/ci-checker-requirements.txt

      - name: Install workflow checker dependencies
        run: python -m pip install -r .github/workflows/ci-checker-requirements.txt

      - name: Check workflow trigger coverage
        run: python3 tools/check_ci_workflows.py

      - name: Check generated simulator LVGL configuration
        shell: bash
        run: |
          generated="$RUNNER_TEMP/lv_conf.h"
          python3 tools/gen_lv_conf.py sdkconfig.m5stick-s3 "$generated"
          if ! cmp -s sim/lv_conf.h "$generated"; then
            diff -u sim/lv_conf.h "$generated" || true
            echo "sim/lv_conf.h is stale; regenerate it from sdkconfig.m5stick-s3" >&2
            exit 1
          fi

      - name: Cache clang-format pip downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-clang-format-${{ hashFiles('.github/workflows/clang-format-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-clang-format-

      - name: Install clang-format
        run: python -m pip install -r .github/workflows/clang-format-requirements.txt

      - name: Check clang-format
        shell: bash
        run: |
          find src include lib/furble sim tests/host -type f \( \
            -name '*.c' -o \
            -name '*.cc' -o \
            -name '*.cpp' -o \
            -name '*.cxx' -o \
            -name '*.h' -o \
            -name '*.hh' -o \
            -name '*.hpp' -o \
            -name '*.hxx' \
          \) -print0 | xargs -0 --no-run-if-empty clang-format --dry-run --Werror --style=file

  discover:
    name: Discover PlatformIO environments
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.environments.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover release and debug environments
        id: environments
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release = [
              "m5stick-c",
              "m5stick-c-plus",
              "m5stack-core",
              "m5stack-core2",
              "m5stick-s3",
              "waveshare-s3-eth",
          ]
          config = Path("platformio.ini").read_text(encoding="utf-8")
          environments = set(
              re.findall(r"(?m)^\s*\[env:([^\]]+)\]\s*$", config)
          )
          debug = [
              f"{name}-debug"
              for name in release
              if f"{name}-debug" in environments
          ]
          platforms = release + debug
          matrix = {"platform": platforms}

          print(f"Building environments: {', '.join(platforms)}")
          print(f"Available debug environments: {', '.join(debug) or 'none'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  build:
    needs:
      - changes
      - discover
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache PlatformIO packages and platforms
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Cache pip downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-platformio-

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Test build version resolution
        run: python patches/test_build_version.py

      - name: Check NimBLE flow-control workaround
        if: ${{ matrix.platform == 'm5stick-c' }}
        run: python3 tests/test_nimble_flow_control_workaround.py

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Check OTA partition-table invariants
        if: ${{ matrix.platform == 'm5stick-c' }}
        run: python3 tools/check_partition_tables.py

      - name: Set build environment
        shell: bash
        run: |
          echo "FURBLE_VERSION=dev" >> "$GITHUB_ENV"
          echo "FURBLE_TEST=0" >> "$GITHUB_ENV"

      - name: Build furble (${{ matrix.platform }})
        shell: bash
        env:
          SIZE_LOG: ${{ runner.temp }}/platformio-${{ matrix.platform }}-size.log
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if platformio run -e "${{ matrix.platform }}" 2>&1 | tee "$SIZE_LOG"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "PlatformIO build failed on attempt $attempt. Retrying once."
          done

      - name: Extract firmware size (${{ matrix.platform }})
        shell: bash
        env:
          SIZE_LOG: ${{ runner.temp }}/platformio-${{ matrix.platform }}-size.log
          SIZE_JSON: firmware-size-${{ matrix.platform }}.json
          FIRMWARE_ENV: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Use PlatformIO's final summary as the source of truth. It is
          # emitted by the pinned CI toolchain after a successful build and
          # avoids relying on the version-specific idf_size.py JSON schema or
          # a separately installed esp-idf-size Python module.
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          size_log = Path(os.environ["SIZE_LOG"])
          text = size_log.read_text(encoding="utf-8")
          pattern = (
              r"(?mi)^\s*{name}:\s*\[[^\r\n]*\]\s*"
              r"([0-9]+(?:\.[0-9]+)?)%\s*"
              r"\(used\s+([0-9]+)\s+bytes\s+from\s+([0-9]+)\s+bytes\)"
          )

          matches = {}
          for name in ("RAM", "Flash"):
              match = re.search(pattern.format(name=name), text)
              if match is None:
                  raise SystemExit(
                      f"PlatformIO {name} size summary was not found in {size_log}"
                  )
              matches[name] = match.groups()

          flash_used = int(matches["Flash"][1])
          ram_used = int(matches["RAM"][1])
          ram_total = int(matches["RAM"][2])
          release_environment = os.environ["FIRMWARE_ENV"].removesuffix("-debug")
          flash_slot = {
              "m5stack-core2": 0x600000,
              "m5stick-s3": 0x300000,
              "waveshare-s3-eth": 6 * 1024 * 1024,
          }.get(release_environment, 1700 * 1024)
          record = {
              "schema": 1,
              "env": os.environ["FIRMWARE_ENV"],
              "flash_used_bytes": flash_used,
              "flash_slot_bytes": flash_slot,
              "ram_used_bytes": ram_used,
              "ram_total_bytes": ram_total,
          }

          Path(os.environ["SIZE_JSON"]).write_text(
              json.dumps(record, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, indent=2))
          PY

      - name: Upload firmware size (${{ matrix.platform }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-size-${{ matrix.platform }}
          path: firmware-size-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  size-report:
    name: Report firmware size on the PR
    permissions:
      contents: read
      actions: read
    needs:
      - changes
      - build
    if: >-
      ${{ github.event_name == 'pull_request' &&
      needs.changes.outputs.firmware == 'true' &&
      needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download current firmware size artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: firmware-size-*
          path: current-sizes
          merge-multiple: true

      - name: Download base firmware sizes from latest master build
        id: base
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # GitHub cache is branch-scope isolated, so a pull_request run can
          # never restore a cache written by a master push. Uploaded artifacts
          # are branch independent, so pull the baseline from the newest
          # successful master build of this workflow instead. Walk back a few
          # runs because docs-only master pushes skip the firmware build and
          # carry no firmware-size artifacts.
          runs_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch master \
            --workflow main.yml \
            --event push \
            --status success \
            --limit 10 \
            --json databaseId,headSha)"
          count="$(echo "$runs_json" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          baseline_sha=""
          for i in $(seq 0 "$((count - 1))"); do
            run_id="$(echo "$runs_json" | python3 -c "import json,sys; print(json.load(sys.stdin)[$i]['databaseId'])")"
            head_sha="$(echo "$runs_json" | python3 -c "import json,sys; print(json.load(sys.stdin)[$i]['headSha'])")"
            rm -rf base-sizes
            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'firmware-size-*' \
              --dir base-sizes; then
              echo "Using master run $run_id at $head_sha for the baseline."
              baseline_sha="$head_sha"
              break
            fi
            echo "Master run $run_id at $head_sha had no firmware-size artifacts. Trying an older run."
          done
          if [[ -z "$baseline_sha" ]]; then
            echo "No master build with firmware-size artifacts was found."
          fi
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"

      - name: Render firmware size report
        id: render
        env:
          CURRENT_SIZES: current-sizes
          BASE_SIZES: base-sizes
          BASELINE_SHA: ${{ steps.base.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = "<!-- furble-firmware-size-report -->"
          flash_slot = 1700 * 1024

          def load_sizes(directory):
              root = Path(directory)
              sizes = {}
              if not root.exists():
                  return sizes
              # gh run download nests each artifact in its own subdirectory,
              # so recurse to find every firmware-size record.
              for path in sorted(root.rglob("*.json")):
                  record = json.loads(path.read_text(encoding="utf-8"))
                  env = record["env"]
                  sizes[env] = record
              return sizes

          current = load_sizes(os.environ["CURRENT_SIZES"])
          if not current:
              raise SystemExit("No current firmware size artifacts were found")

          # The baseline comes from the newest successful master build of this
          # workflow. Its head sha is exported by the download step, or empty
          # when no prior master build carried firmware-size artifacts.
          baseline_sha = os.environ.get("BASELINE_SHA", "").strip()
          base_available = bool(baseline_sha)
          base = load_sizes(os.environ["BASE_SIZES"]) if base_available else {}

          def signed_bytes(value):
              if value == 0:
                  return "0 B"
              return f"{value:+,} B"

          def flash_text(record):
              used = record["flash_used_bytes"]
              slot = record.get("flash_slot_bytes", 1700 * 1024)
              percent = used / slot * 100
              return f"{used:,} B ({percent:.1f}%)"

          rows = []
          missing_base = []
          for env in sorted(current):
              record = current[env]
              if base_available and env in base:
                  base_record = base[env]
                  flash_delta = (
                      record["flash_used_bytes"] - base_record["flash_used_bytes"]
                  )
                  ram_delta = (
                      record["ram_used_bytes"] - base_record["ram_used_bytes"]
                  )
                  base_flash = base_record["flash_used_bytes"]
                  flash_growth = flash_delta / base_flash * 100 if base_flash else 0
                  flash_flag = " ⚠️" if flash_growth > 1 else ""
                  ram_flag = " ⚠️" if ram_delta > 0 else ""
                  flash_delta_text = (
                      f"{signed_bytes(flash_delta)} ({flash_growth:+.2f}%){flash_flag}"
                  )
                  ram_delta_text = f"{signed_bytes(ram_delta)}{ram_flag}"
              else:
                  if base_available:
                      missing_base.append(env)
                  flash_delta_text = "n/a"
                  ram_delta_text = "n/a"

              rows.append(
                  "| {env} | {flash} | {ram:,} B | {flash_delta} | {ram_delta} |".format(
                      env=env,
                      flash=flash_text(record),
                      ram=record["ram_used_bytes"],
                      flash_delta=flash_delta_text,
                      ram_delta=ram_delta_text,
                  )
              )

          body = [
              marker,
              "## Firmware size report",
              "",
              "| Env | Flash used | RAM used | Flash delta vs base | RAM delta vs base |",
              "| --- | ---: | ---: | ---: | ---: |",
              *rows,
          ]

          short_baseline = baseline_sha[:12]
          if not base_available:
              body.extend(
                  [
                      "",
                      "> No firmware size baseline is available yet. Deltas are "
                      "omitted. The newest successful firmware build on a "
                      "`master` push provides the baseline.",
                  ]
              )
          else:
              body.extend(
                  [
                      "",
                      "Base comparison: latest `master` build at commit "
                      f"`{short_baseline}`.",
                      "Flash growth over 1% and any positive RAM delta are marked with ⚠️.",
                  ]
              )
              if missing_base:
                  body.append(
                      "> The baseline build did not contain: "
                      + ", ".join(f"`{env}`" for env in missing_base)
                      + ". Those rows have no deltas."
                  )

          report = "\n".join(body) + "\n"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("body<<SIZE_REPORT_EOF\n")
              output.write(report)
              output.write("SIZE_REPORT_EOF\n")
          PY

      - name: Add firmware size report to job summary
        env:
          REPORT_BODY: ${{ steps.render.outputs.body }}
        run: |
          set -euo pipefail
          test -n "$REPORT_BODY"
          printf '%s\n' "$REPORT_BODY" >> "$GITHUB_STEP_SUMMARY"

  success:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - host_camera
      - format
      - discover
      - build
    steps:
      - name: Check required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FIRMWARE_CHANGED: ${{ needs.changes.outputs.firmware }}
          HOST_CAMERA_RESULT: ${{ needs.host_camera.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "The changed-path check did not succeed."
            exit 1
          fi

          if [[ "$HOST_CAMERA_RESULT" != "success" ]]; then
            echo "The host camera harness failed or was cancelled."
            exit 1
          fi

          if [[ "$FIRMWARE_CHANGED" == "true" ]]; then
            if [[ "$FORMAT_RESULT" != "success" || \
              "$DISCOVER_RESULT" != "success" || \
              "$BUILD_RESULT" != "success" ]]; then
              echo "A firmware CI job failed or was cancelled."
              exit 1
            fi
          else
            if [[ "$FORMAT_RESULT" != "success" && "$FORMAT_RESULT" != "skipped" ]]; then
              echo "The format job did not succeed or skip cleanly."
              exit 1
            fi
            if [[ "$DISCOVER_RESULT" != "success" && "$DISCOVER_RESULT" != "skipped" ]]; then
              echo "The environment discovery job did not succeed or skip cleanly."
              exit 1
            fi
            if [[ "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ]]; then
              echo "The build job did not succeed or skip cleanly."
              exit 1
            fi
          fi

          echo "Required CI jobs passed or skipped as expected."
