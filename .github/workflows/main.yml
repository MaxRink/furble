name: PlatformIO CI

on:
  push:
    branches:
      - master
      - combined
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect firmware changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 "$CURRENT_SHA")"
          fi

          firmware_changed=false
          changed_paths="$(git diff --name-only --no-renames "$base_sha" "$CURRENT_SHA")"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              companion/android/*|plans/*|web-installer/*|README.md|*.md)
                ;;
              *)
                firmware_changed=true
                break
                ;;
            esac
          done <<< "$changed_paths"

          echo "Firmware paths changed: $firmware_changed"
          echo "firmware=$firmware_changed" >> "$GITHUB_OUTPUT"

  format:
    name: clang-format
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache clang-format pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-clang-format-${{ hashFiles('.github/workflows/clang-format-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-clang-format-

      - name: Install clang-format
        run: python -m pip install -r .github/workflows/clang-format-requirements.txt

      - name: Check clang-format
        shell: bash
        run: |
          find src include lib/furble sim -type f \( \
            -name '*.c' -o \
            -name '*.cc' -o \
            -name '*.cpp' -o \
            -name '*.cxx' -o \
            -name '*.h' -o \
            -name '*.hh' -o \
            -name '*.hpp' -o \
            -name '*.hxx' \
          \) -print0 | xargs -0 --no-run-if-empty clang-format --dry-run --Werror --style=file

  discover:
    name: Discover PlatformIO environments
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.environments.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6

      - name: Discover release and debug environments
        id: environments
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release = [
              "m5stick-c",
              "m5stick-c-plus",
              "m5stack-core",
              "m5stack-core2",
              "m5stick-s3",
          ]
          config = Path("platformio.ini").read_text(encoding="utf-8")
          environments = set(
              re.findall(r"(?m)^\s*\[env:([^\]]+)\]\s*$", config)
          )
          debug = [
              f"{name}-debug"
              for name in release
              if f"{name}-debug" in environments
          ]
          platforms = release + debug
          matrix = {"platform": platforms}

          print(f"Building environments: {', '.join(platforms)}")
          print(f"Available debug environments: {', '.join(debug) or 'none'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  build:
    needs:
      - changes
      - discover
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache PlatformIO packages and platforms
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Cache pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-platformio-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Set build environment
        shell: bash
        run: |
          echo "FURBLE_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          echo "FURBLE_TEST=0" >> "$GITHUB_ENV"

      - name: Build furble (${{ matrix.platform }})
        shell: bash
        run: |
          for attempt in 1 2; do
            if platformio run -e "${{ matrix.platform }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "PlatformIO build failed on attempt $attempt. Retrying once."
          done

  success:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - format
      - discover
      - build
    steps:
      - name: Check required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FIRMWARE_CHANGED: ${{ needs.changes.outputs.firmware }}
          FORMAT_RESULT: ${{ needs.format.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "The changed-path check did not succeed."
            exit 1
          fi

          if [[ "$FIRMWARE_CHANGED" == "true" ]]; then
            if [[ "$FORMAT_RESULT" != "success" || \
              "$DISCOVER_RESULT" != "success" || \
              "$BUILD_RESULT" != "success" ]]; then
              echo "A firmware CI job failed or was cancelled."
              exit 1
            fi
          else
            if [[ "$FORMAT_RESULT" != "success" && "$FORMAT_RESULT" != "skipped" ]]; then
              echo "The format job did not succeed or skip cleanly."
              exit 1
            fi
            if [[ "$DISCOVER_RESULT" != "success" && "$DISCOVER_RESULT" != "skipped" ]]; then
              echo "The environment discovery job did not succeed or skip cleanly."
              exit 1
            fi
            if [[ "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ]]; then
              echo "The build job did not succeed or skip cleanly."
              exit 1
            fi
          fi

          echo "Required CI jobs passed or skipped as expected."
