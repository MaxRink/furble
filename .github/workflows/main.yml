name: PlatformIO CI

on:
  push:
    branches:
      - master
      - combined
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect firmware changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 "$CURRENT_SHA")"
          fi

          firmware_changed=false
          changed_paths="$(git diff --name-only --no-renames "$base_sha" "$CURRENT_SHA")"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              companion/android/*|plans/*|web-installer/*|README.md|*.md)
                ;;
              *)
                firmware_changed=true
                break
                ;;
            esac
          done <<< "$changed_paths"

          echo "Firmware paths changed: $firmware_changed"
          echo "firmware=$firmware_changed" >> "$GITHUB_OUTPUT"

  format:
    name: clang-format
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache clang-format pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-clang-format-${{ hashFiles('.github/workflows/clang-format-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-clang-format-

      - name: Install clang-format
        run: python -m pip install -r .github/workflows/clang-format-requirements.txt

      - name: Check clang-format
        shell: bash
        run: |
          find src include lib/furble sim -type f \( \
            -name '*.c' -o \
            -name '*.cc' -o \
            -name '*.cpp' -o \
            -name '*.cxx' -o \
            -name '*.h' -o \
            -name '*.hh' -o \
            -name '*.hpp' -o \
            -name '*.hxx' \
          \) -print0 | xargs -0 --no-run-if-empty clang-format --dry-run --Werror --style=file

  discover:
    name: Discover PlatformIO environments
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.environments.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6

      - name: Discover release and debug environments
        id: environments
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release = [
              "m5stick-c",
              "m5stick-c-plus",
              "m5stack-core",
              "m5stack-core2",
              "m5stick-s3",
          ]
          config = Path("platformio.ini").read_text(encoding="utf-8")
          environments = set(
              re.findall(r"(?m)^\s*\[env:([^\]]+)\]\s*$", config)
          )
          debug = [
              f"{name}-debug"
              for name in release
              if f"{name}-debug" in environments
          ]
          platforms = release + debug
          matrix = {"platform": platforms}

          print(f"Building environments: {', '.join(platforms)}")
          print(f"Available debug environments: {', '.join(debug) or 'none'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  build:
    needs:
      - changes
      - discover
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache PlatformIO packages and platforms
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Cache pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-platformio-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-platformio-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Set build environment
        shell: bash
        run: |
          echo "FURBLE_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          echo "FURBLE_TEST=0" >> "$GITHUB_ENV"

      - name: Build furble (${{ matrix.platform }})
        shell: bash
        env:
          SIZE_LOG: ${{ runner.temp }}/platformio-${{ matrix.platform }}-size.log
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if platformio run -e "${{ matrix.platform }}" 2>&1 | tee "$SIZE_LOG"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "PlatformIO build failed on attempt $attempt. Retrying once."
          done

      - name: Extract firmware size (${{ matrix.platform }})
        shell: bash
        env:
          SIZE_LOG: ${{ runner.temp }}/platformio-${{ matrix.platform }}-size.log
          SIZE_JSON: firmware-size-${{ matrix.platform }}.json
          FIRMWARE_ENV: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Use PlatformIO's final summary as the source of truth. It is
          # emitted by the pinned CI toolchain after a successful build and
          # avoids relying on the version-specific idf_size.py JSON schema or
          # a separately installed esp-idf-size Python module.
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          size_log = Path(os.environ["SIZE_LOG"])
          text = size_log.read_text(encoding="utf-8")
          pattern = (
              r"(?mi)^\s*{name}:\s*\[[^\r\n]*\]\s*"
              r"([0-9]+(?:\.[0-9]+)?)%\s*"
              r"\(used\s+([0-9]+)\s+bytes\s+from\s+([0-9]+)\s+bytes\)"
          )

          matches = {}
          for name in ("RAM", "Flash"):
              match = re.search(pattern.format(name=name), text)
              if match is None:
                  raise SystemExit(
                      f"PlatformIO {name} size summary was not found in {size_log}"
                  )
              matches[name] = match.groups()

          flash_used = int(matches["Flash"][1])
          ram_used = int(matches["RAM"][1])
          ram_total = int(matches["RAM"][2])
          flash_slot = 1700 * 1024
          record = {
              "schema": 1,
              "env": os.environ["FIRMWARE_ENV"],
              "flash_used_bytes": flash_used,
              "flash_slot_bytes": flash_slot,
              "ram_used_bytes": ram_used,
              "ram_total_bytes": ram_total,
          }

          Path(os.environ["SIZE_JSON"]).write_text(
              json.dumps(record, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, indent=2))
          PY

      - name: Upload firmware size (${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: firmware-size-${{ matrix.platform }}
          path: firmware-size-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  cache-firmware-sizes:
    name: Cache firmware sizes for master
    needs:
      - changes
      - build
    if: >-
      ${{ github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.firmware == 'true' &&
      needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download firmware size artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-size-*
          path: firmware-sizes
          merge-multiple: true

      - name: Save firmware sizes for this commit
        uses: actions/cache/save@v5
        with:
          path: firmware-sizes
          key: furble-firmware-size-v1-${{ github.sha }}

  size-report:
    name: Report firmware size on the PR
    permissions:
      contents: read
      pull-requests: write
    needs:
      - changes
      - build
    if: >-
      ${{ github.event_name == 'pull_request' &&
      needs.changes.outputs.firmware == 'true' &&
      needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download current firmware size artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-size-*
          path: current-sizes
          merge-multiple: true

      - name: Restore base firmware sizes
        id: base_cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: base-sizes
          key: furble-firmware-size-v1-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            furble-firmware-size-v1-

      - name: Render firmware size report
        id: render
        env:
          CURRENT_SIZES: current-sizes
          BASE_SIZES: base-sizes
          BASE_MATCHED_KEY: ${{ steps.base_cache.outputs.cache-matched-key }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = "<!-- furble-firmware-size-report -->"
          flash_slot = 1700 * 1024

          def load_sizes(directory):
              root = Path(directory)
              sizes = {}
              if not root.exists():
                  return sizes
              for path in sorted(root.glob("*.json")):
                  record = json.loads(path.read_text(encoding="utf-8"))
                  env = record["env"]
                  sizes[env] = record
              return sizes

          current = load_sizes(os.environ["CURRENT_SIZES"])
          if not current:
              raise SystemExit("No current firmware size artifacts were found")

          # The restore step tries the exact base sha first and then falls
          # back to the newest master size cache via the restore-keys
          # prefix. cache-matched-key names whichever key actually hit, so
          # the report can state which commit the baseline came from.
          key_prefix = "furble-firmware-size-v1-"
          matched_key = os.environ.get("BASE_MATCHED_KEY", "")
          baseline_sha = ""
          if matched_key.startswith(key_prefix):
              baseline_sha = matched_key[len(key_prefix):]
          base_cache_hit = bool(baseline_sha)
          base = load_sizes(os.environ["BASE_SIZES"]) if base_cache_hit else {}

          def signed_bytes(value):
              if value == 0:
                  return "0 B"
              return f"{value:+,} B"

          def flash_text(record):
              used = record["flash_used_bytes"]
              percent = used / flash_slot * 100
              return f"{used:,} B ({percent:.1f}%)"

          rows = []
          missing_base = []
          for env in sorted(current):
              record = current[env]
              if base_cache_hit and env in base:
                  base_record = base[env]
                  flash_delta = (
                      record["flash_used_bytes"] - base_record["flash_used_bytes"]
                  )
                  ram_delta = (
                      record["ram_used_bytes"] - base_record["ram_used_bytes"]
                  )
                  base_flash = base_record["flash_used_bytes"]
                  flash_growth = flash_delta / base_flash * 100 if base_flash else 0
                  flash_flag = " ⚠️" if flash_growth > 1 else ""
                  ram_flag = " ⚠️" if ram_delta > 0 else ""
                  flash_delta_text = (
                      f"{signed_bytes(flash_delta)} ({flash_growth:+.2f}%){flash_flag}"
                  )
                  ram_delta_text = f"{signed_bytes(ram_delta)}{ram_flag}"
              else:
                  if base_cache_hit:
                      missing_base.append(env)
                  flash_delta_text = "n/a"
                  ram_delta_text = "n/a"

              rows.append(
                  "| {env} | {flash} | {ram:,} B | {flash_delta} | {ram_delta} |".format(
                      env=env,
                      flash=flash_text(record),
                      ram=record["ram_used_bytes"],
                      flash_delta=flash_delta_text,
                      ram_delta=ram_delta_text,
                  )
              )

          body = [
              marker,
              "## Firmware size report",
              "",
              "| Env | Flash used | RAM used | Flash delta vs base | RAM delta vs base |",
              "| --- | ---: | ---: | ---: | ---: |",
              *rows,
          ]

          base_sha = os.environ["BASE_SHA"]
          base_ref = os.environ["BASE_REF"]
          short_sha = base_sha[:12]
          short_baseline = baseline_sha[:12]
          if not base_cache_hit:
              body.extend(
                  [
                      "",
                      f"> No size cache was found for `{base_ref}`, not even via "
                      "the prefix fallback. Deltas are omitted. A successful "
                      "firmware build on a master push creates this cache.",
                  ]
              )
          elif baseline_sha == base_sha:
              body.extend(
                  [
                      "",
                      f"Base comparison: `{base_ref}` commit `{short_sha}`.",
                      "Flash growth over 1% and any positive RAM delta are marked with ⚠️.",
                  ]
              )
          else:
              body.extend(
                  [
                      "",
                      f"Base comparison: `{base_ref}` commit `{short_baseline}` "
                      "(nearest cached baseline, not the exact PR base).",
                      f"The PR base commit `{short_sha}` had no size cache. That "
                      "happens when that master push skipped firmware builds or "
                      "its cache save had not finished yet.",
                      "Flash growth over 1% and any positive RAM delta are marked with ⚠️.",
                  ]
              )
              if missing_base:
                  body.append(
                      "> The base cache did not contain: "
                      + ", ".join(f"`{env}`" for env in missing_base)
                      + ". Those rows have no deltas."
                  )

          report = "\n".join(body) + "\n"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("body<<SIZE_REPORT_EOF\n")
              output.write(report)
              output.write("SIZE_REPORT_EOF\n")
          PY

      - name: Create or update sticky PR comment
        uses: actions/github-script@v7
        env:
          REPORT_BODY: ${{ steps.render.outputs.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- furble-firmware-size-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = process.env.REPORT_BODY;
            if (!body) {
              core.setFailed('The rendered firmware size report was empty.');
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (comment) => typeof comment.body === 'string' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated firmware size comment ${existing.id}.`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info(`Created firmware size comment ${created.data.id}.`);
            }

  success:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - format
      - discover
      - build
    steps:
      - name: Check required job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FIRMWARE_CHANGED: ${{ needs.changes.outputs.firmware }}
          FORMAT_RESULT: ${{ needs.format.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "The changed-path check did not succeed."
            exit 1
          fi

          if [[ "$FIRMWARE_CHANGED" == "true" ]]; then
            if [[ "$FORMAT_RESULT" != "success" || \
              "$DISCOVER_RESULT" != "success" || \
              "$BUILD_RESULT" != "success" ]]; then
              echo "A firmware CI job failed or was cancelled."
              exit 1
            fi
          else
            if [[ "$FORMAT_RESULT" != "success" && "$FORMAT_RESULT" != "skipped" ]]; then
              echo "The format job did not succeed or skip cleanly."
              exit 1
            fi
            if [[ "$DISCOVER_RESULT" != "success" && "$DISCOVER_RESULT" != "skipped" ]]; then
              echo "The environment discovery job did not succeed or skip cleanly."
              exit 1
            fi
            if [[ "$BUILD_RESULT" != "success" && "$BUILD_RESULT" != "skipped" ]]; then
              echo "The build job did not succeed or skip cleanly."
              exit 1
            fi
          fi

          echo "Required CI jobs passed or skipped as expected."
