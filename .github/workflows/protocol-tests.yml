name: Companion protocol tests

"on":
  push:
    paths:
      - include/FurbleCompanion.h
      - include/FurbleSettings.h
      - src/FurbleCompanion.cpp
      - src/FurbleSettings.cpp
      - lib/furble/**
      - companion/android/**/protocol/**
      - tests/protocol/**
      - .github/workflows/protocol-tests.yml
  pull_request:
    paths:
      - include/FurbleCompanion.h
      - include/FurbleSettings.h
      - src/FurbleCompanion.cpp
      - src/FurbleSettings.cpp
      - lib/furble/**
      - companion/android/**/protocol/**
      - tests/protocol/**
      - .github/workflows/protocol-tests.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request run for the same ref supersedes the previous one, so a
# stale pull request run stops instead of queueing. Every other event keys its
# own group on the run, so a push, schedule or dispatch run is never cancelled
# and never replaces a pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'shared' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol:
    name: Host protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate golden corpus
        run: make -C tests/protocol CXX=clang++ generate

      - name: Check generated corpus
        run: git diff --exit-code -- tests/protocol/golden

      - name: Build and run host suite
        run: make -C tests/protocol CXX=clang++ test
