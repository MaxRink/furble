# furble per-board current model
#
# Machine readable input for the plan 63 sim energy model.
# All values are milliamps (value_ma, min, max). Seconds or other units are
# named explicitly in the key. Every entry carries the source URL that was
# fetched and verified to contain the number, plus a confidence tag:
#   datasheet             number read from the primary component datasheet
#   published-measurement vendor spec or methodical third party measurement
#   estimated             derived or interpolated, reasoning in the note
#   measured-local        measured on this project's hardware, see
#                         plans/00-hardware-experiments.md
# Where a datasheet gives a range, min and max hold the range ends and
# value_ma is the midpoint unless the note says otherwise.
# The _shared block holds YAML anchors. Consumers should read only the five
# board keys; aliases expand to full values in any YAML 1.1/1.2 loader.

meta:
  generated: "2026-08-16"
  purpose: "Input tables for the plan 63 simulation energy model"
  units: "mA unless the key name says otherwise"
  ground_truth: "plans/00-hardware-experiments.md overrides on conflict"

