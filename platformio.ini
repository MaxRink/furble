[furble]
; cJSON recurses once per nesting level; its default limit of 1,000 levels
; would let one request body overflow a task stack. Furble accepts only flat
; objects. tools/stack_budget.json bounds parse_value by this limit.
; Keep GCC's optimizer/hash decisions independent of the checkout pathname.
build_flags = -Wall -Wextra -frandom-seed=furble -fcallgraph-info=su
  -DFURBLE_TEST_VERSION=${sysenv.FURBLE_TEST}
  -DFURBLE_BATTERY_DEBUG=0
  -DCJSON_NESTING_LIMIT=8

[env]
platform = espressif32@6.13.0
platform_packages = framework-espidf@3.50503.0
board_build.f_cpu = 80000000L
board_build.partitions = partitions_two_ota_large.csv
# Every application partition starts at 0x20000 in the ESP-IDF OTA layouts.
# Keep this explicit because PlatformIO's ``-t nobuild -t upload`` path does
# not run the framework partition discovery that normally replaces its
# historical 0x10000 default.  Without this setting, a development upload
# writes firmware.bin at 0x10000 instead of the selected app slot, corrupts
# the data region before ota_0, and can leave the previous app selected.
board_upload.offset_address = 0x20000
upload_protocol = esptool
monitor_speed = 115200
framework = espidf
; Use a full 40-character SHA for Git dependencies. The VSCode PlatformIO
; extension fetches the pin as a ref, and a short SHA fails with
; "couldn't find remote ref" (upstream issue 309).
lib_deps =
  M5PM1@1.0.6
  M5GFX@0.2.27
  M5Unified@0.2.20
  https://github.com/gkoh/TinyGPSPlus#92ac8c21b8179201c2c8c534e46af3320b76d3e7

extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py

[env:m5stick-c]
board = m5stick-c
; FURBLE_PIN_SHARE is the capability the LED/IR arbiter needs. Only the StickC
; family has an LED pin, so every other image compiles the inert forms and does
; not spend the ~900 bytes the arbiter costs in a 4 MB debug image. The
; simulator is not a consumer: it shims FurbleFeedback.h and FurbleIR.h and
; never compiles the arbiter glue.
build_flags = ${furble.build_flags} -DFURBLE_M5STICKC -DFURBLE_PIN_SHARE=1 -DM5GFX_BOARD=board_t::board_M5StickC

[env:m5stick-c-plus]
board = m5stick-c
build_flags = ${furble.build_flags} -DFURBLE_M5STICKC_PLUS -DFURBLE_PIN_SHARE=1

[env:m5stack-core]
board = m5stack-core-esp32
; The Core's IMU is an InvenSense MPU6886 or MPU9250, never a Bosch BMI270,
; so this image compiles the BMI270 probe and its 8,192-byte init blob out. The
; debug profiles below inherit the define with the rest of this flag list.
build_flags = ${furble.build_flags} -DFURBLE_GROVE_CORE -DFURBLE_M5COREX -DFURBLE_M5STACK_CORE -DM5GFX_BOARD=board_t::board_M5Stack -DFURBLE_IMU_BMI270=0

[env:m5stack-core2]
board = m5stack-core2
board_build.partitions = partitions_two_ota_16m.csv
board_build.cmake_extra_args = -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1
; The Core2 names FURBLE_IMU_BMI270=1 explicitly, which is also the default. It
; is not a measured need: docs/components/mpu6886.md puts an MPU6886 in the
; Core2 and a M5Tough, so this lane could take the same 8 KiB the Core gives
; up. It does not, because nothing here audited the Core2 part inventory board
; by board and its app slot has more than 4 MB free. Settle that inventory
; before dropping the define (plans/347).
build_flags = ${furble.build_flags} -DFURBLE_M5COREX -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_IMU_BMI270=1

[env:m5stick-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_two_ota_8m.csv
board_build.cmake_extra_args = -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1
build_flags = ${furble.build_flags} -DFURBLE_M5STICKS3 -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DM5GFX_BOARD=board_t::board_M5StickS3 -DFURBLE_IMU_BMI270=1
board_upload.after_reset = watchdog_reset

[env:esp32-s3-headless]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_two_ota_8m.csv
board_build.cmake_extra_args = -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_NO_DISPLAY=1 -DEXCLUDE_COMPONENTS=icons
build_flags = ${furble.build_flags} -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_NO_DISPLAY -DFURBLE_CONSOLE=1 -DFURBLE_USB_CONSOLE=1

; LilyGO boards. M5Unified detects none of them, so each image pins M5GFX at a
; display-less M5 name only to take the no-probe return in
; post:patches/m5gfx_board.py; Board::compiledProfile() ignores the detected
; value and answers from the build macro. The panel, the key matrix and the
; trackball are Furble's own, in src/FurbleDisplay.cpp and
; src/FurbleLilyGoDevice.cpp. See plans/387-lilygo-family-port.md.
;
; 16 MB flash and 8 MB PSRAM: the two OTA slots of partitions_two_ota_16m.csv
; are 6 MB each, which is the room the MQTT and WebUI profiles need.
[env:lilygo-tdeck]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
; The devkitc-1 board manifest says 8 MB, and that is the value the partition
; generator checks the table against, so board_build.flash_size alone leaves the
; 12.4 MB OTA table rejected. board_upload.flash_size is the setting that moves
; the manifest's own size.
board_upload.flash_size = 16MB
board_build.partitions = partitions_two_ota_16m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.lilygo-tdeck
board_build.cmake_extra_args = -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_LILYGO=1
; FURBLE_IMU_BMI270=0: the T-Deck has no IMU, and the BMI270 blob and driver are
; dead weight in an app slot this image shares with MQTT and the WebUI.
build_flags = ${furble.build_flags} -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_LILYGO_TDECK -DM5GFX_BOARD=board_t::board_M5StampS3 -DFURBLE_IMU_BMI270=0

[env:lilygo-tdeck-debug]
extends = env:lilygo-tdeck
[env:lilygo-tbeam-supreme]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_two_ota_8m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.lilygo-tbeam-supreme
board_build.cmake_extra_args = -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1
; No M5GFX arm describes this board, and unpinned autodetect would probe every
; M5 ESP32-S3 board's panel, touch and PMIC pins, including the I2C and SPI
; pins this board uses for its own PMIC, OLED and radio. The pin names the
; display-less StampS3 family only to take the no-probe return in
; post:patches/m5gfx_board.py. Board::compiledProfile() ignores the detected
; value, so the pin never decides a profile row. See plans/390.
; FURBLE_IMU_BMI270=0: the QMI8658 on this board has no backend, and the
; BMI270 blob and driver are dead weight in a 3 MB app slot.
build_flags = ${furble.build_flags} -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_LILYGO_TBEAM_SUPREME -DM5GFX_BOARD=board_t::board_M5StampS3 -DFURBLE_IMU_BMI270=0

[env:lilygo-tbeam-supreme-debug]
extends = env:lilygo-tbeam-supreme
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector,sdkconfig.spiram-memtest,sdkconfig.coredump-flash
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:lilygo-tbeam-supreme.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1

[env:lilygo-twatch-ultra]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_two_ota_16m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.lilygo-twatch-ultra
board_build.cmake_extra_args = -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_LILYGO=1
; The Ultra has a BHI260AP, not a BMI270, and no backend for it in this port.
build_flags = ${furble.build_flags} -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_LILYGO_TWATCH_ULTRA -DM5GFX_BOARD=board_t::board_M5StampS3 -DFURBLE_IMU_BMI270=0

[env:lilygo-twatch-ultra-debug]
extends = env:lilygo-twatch-ultra
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector,sdkconfig.spiram-memtest,sdkconfig.coredump-flash
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:lilygo-twatch-ultra.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1

[env:waveshare-s3-eth]
extends = env:esp32-s3-headless
board = waveshare-esp32-s3-eth
board_build.partitions = partitions_waveshare_s3_eth.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.waveshare-s3-eth
board_build.cmake_extra_args = ${env:esp32-s3-headless.board_build.cmake_extra_args} -DFURBLE_ETHERNET=1
; The headless parent is a developer hub image with the console. This release
; artifact must not inherit it: docs/console-commands.md promises no release
; build contains the console, and the console task plus USB Serial/JTAG driver
; are a debug surface a shipped hub does not need. Spell the flags out instead
; of inheriting the parent string, because PlatformIO build_unflags matches
; whole list items and the parent flags arrive as one space-separated item.
; The -debug env below adds the console back explicitly.
; M5GFX autodetect probes every M5 S3 board and several of those probes drive
; the W5500 pins GPIO 9 to 14. StampS3 has no M5GFX arm, so assigning the pin
; alone left autodetect at board_unknown, which also ran it five times over the
; retry loop. M5Unified then ran its own ESP32-S3 identification probe over
; GPIO 4, 8, 10, 12 and 38, and opened In_I2C on GPIO 38/39.
; post:patches/m5gfx_board.py returns the display-less StampS3 family before the
; first probe, so nothing here drives those pins. See plans/352-m5gfx-board-pin.md.
build_flags = ${furble.build_flags} -DFURBLE_MQTT=1 -DFURBLE_WEBUI=1 -DFURBLE_NO_DISPLAY -DFURBLE_WAVESHARE_S3_ETH -DFURBLE_ETHERNET -DM5GFX_BOARD=board_t::board_M5StampS3
; Developer only environments. CI and releases build the six environments above.
; FURBLE_CONSOLE builds in the serial command console, see src/FurbleConsole.cpp.
; Without an explicit path PlatformIO generates a fresh sdkconfig for each new
; environment name, so every variant points back at the sdkconfig of the board it
; extends. Only the compiler flags differ.
[env:m5stick-c-debug]
extends = env:m5stick-c
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stick-c
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
# Keep debug symbols and assertions while using the size optimizer so this 4 MB
# board retains both OTA slots. This trades some source-level stepping fidelity.
debug_build_flags = -Os -g2 -ggdb2
build_flags = ${env:m5stick-c.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1

[env:m5stick-c-plus-debug]
extends = env:m5stick-c-plus
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stick-c-plus
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
# Keep debug symbols and assertions while using the size optimizer so this 4 MB
# board retains both OTA slots. This trades some source-level stepping fidelity.
debug_build_flags = -Os -g2 -ggdb2
build_flags = ${env:m5stick-c-plus.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1

[env:m5stack-core-debug]
extends = env:m5stack-core
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stack-core
; The stack protector (sdkconfig.stack-protector) adds 24 KB and does not fit
; this OTA slot, so this profile omits it. The USB profile keeps it.
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
# Keep debug symbols and assertions while using the size optimizer so this 4 MB
# board retains both OTA slots. This trades some source-level stepping fidelity.
debug_build_flags = -Os -g2 -ggdb2
; This profile keeps the full debug log maximum. The ESP_LOG_INFO cap #518
; merged here is reverted: it sold the field diagnostics this lane exists for,
; and the BMI270 blob this env no longer links pays for the restoration
; (plans/347).
; The dual-band GNSS support does not fit this slot beside the verbose console:
; the release Core build already leaves 768 bytes free of 1,740,800
; (tools/size_budget.json), and the L5 keys, the capability probe and their
; reporting cost about 2.9 KB (GpsUbx.h FURBLE_GPS_L5). This developer-only
; profile therefore configures L1 only. The USB profile below has the single
; factory partition and turns it back on.
build_flags = ${env:m5stack-core.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1 -DFURBLE_GPS_L5=0

; This profile repeats the debug settings instead of extending
; env:m5stack-core-debug, because that env compiles the dual-band GNSS support
; out with -DFURBLE_GPS_L5=0 and a second -D for the same macro is a warning
; this profile's -Werror would reject. The single factory partition has the
; room, so the feature stays here.
[env:m5stack-core-usb-debug]
extends = env:m5stack-core
board_build.partitions = partitions_single_factory_4m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stack-core
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
debug_build_flags = -Os -g2 -ggdb2
build_flags = ${env:m5stack-core.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector,${platformio.src_dir}/../sdkconfig.m5stack-core-usb-debug

[env:m5stack-core2-debug]
extends = env:m5stack-core2
board_build.partitions = partitions_two_ota_16m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stack-core2
; Core2 has 8 MB PSRAM. Like the S3 debug profiles, merge the boot-time PSRAM
; memory test back in that the release sdkconfig drops.
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector,sdkconfig.spiram-memtest,sdkconfig.coredump-flash
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
# Keep debug symbols and assertions while using the size optimizer so Core2
# retains room for its network hub image. This trades some source-level
# stepping fidelity.
debug_build_flags = -Os -g2 -ggdb2
build_flags = ${env:m5stack-core2.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1

[env:m5stick-s3-debug]
extends = env:m5stick-s3
board_build.partitions = partitions_two_ota_8m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stick-s3
; The release sdkconfig drops the full PSRAM memory test for boot time. This
; diagnostic profile merges it back in, along with the usual debug symbols.
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector,sdkconfig.spiram-memtest,sdkconfig.coredump-flash
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:m5stick-s3.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1
debug_tool = esp-builtin
debug_init_break = tbreak app_main

[env:m5stick-s3-debug-ble]
extends = env:m5stick-s3-debug
; Dedicated bench image: adds a read-only, unencrypted BLE status service so the
; device can be diagnosed when the USB CDC endpoint is unavailable.
build_flags = ${env:m5stick-s3-debug.build_flags} -DFURBLE_BLE_DEBUG=1

[env:waveshare-s3-eth-debug]
extends = env:waveshare-s3-eth
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.waveshare-s3-eth
board_build.esp-idf.sdkconfig_fragment = sdkconfig.debug,sdkconfig.stack-protector,sdkconfig.spiram-memtest,sdkconfig.coredump-flash,sdkconfig.full-diagnostics
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  post:patches/m5gfx_board.py
  post:patches/m5unified_bmi270.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:waveshare-s3-eth.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1 -DFURBLE_TASK_WDT=1 -DFURBLE_DEBUG_BUILD=1 -DFURBLE_USB_CONSOLE=1
