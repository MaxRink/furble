[furble]
; Keep GCC's optimizer/hash decisions independent of the checkout pathname.
build_flags = -Wall -Wextra -frandom-seed=furble
  -DFURBLE_TEST_VERSION=${sysenv.FURBLE_TEST}
  -DFURBLE_BATTERY_DEBUG=0

[env]
platform = espressif32@6.13.0
platform_packages = framework-espidf@3.50503.0
board_build.f_cpu = 80000000L
board_build.partitions = partitions_two_ota_large.csv
upload_protocol = esptool
monitor_speed = 115200
framework = espidf
lib_deps =
  M5PM1@1.0.6
  M5GFX@0.2.27
  M5Unified@0.2.20
  https://github.com/gkoh/TinyGPSPlus#92ac8c2

extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py

[env:m5stick-c]
board = m5stick-c
build_flags = ${furble.build_flags} -DFURBLE_M5STICKC

[env:m5stick-c-plus]
board = m5stick-c
build_flags = ${furble.build_flags} -DFURBLE_M5STICKC_PLUS

[env:m5stack-core]
board = m5stack-core-esp32
build_flags = ${furble.build_flags} -DFURBLE_GROVE_CORE -DFURBLE_M5COREX -DFURBLE_M5STACK_CORE

[env:m5stack-core2]
board = m5stack-core2
board_build.partitions = partitions_two_ota_16m.csv
build_flags = ${furble.build_flags} -DFURBLE_M5COREX

[env:m5stick-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_two_ota_8m.csv
build_flags = ${furble.build_flags} -DFURBLE_M5STICKS3
board_upload.after_reset = watchdog_reset

[env:esp32-s3-headless]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_two_ota_8m.csv
board_build.cmake_extra_args = -DFURBLE_NO_DISPLAY=1 -DEXCLUDE_COMPONENTS=icons
build_flags = ${furble.build_flags} -DFURBLE_NO_DISPLAY -DFURBLE_CONSOLE=1 -DFURBLE_USB_CONSOLE=1

[env:waveshare-s3-eth]
extends = env:esp32-s3-headless
board = waveshare-esp32-s3-eth
board_build.partitions = partitions_waveshare_s3_eth.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.waveshare-s3-eth
build_flags = ${env:esp32-s3-headless.build_flags} -DFURBLE_WAVESHARE_S3_ETH -DFURBLE_ETHERNET
; Developer only environments. CI and releases build the six environments above.
; FURBLE_CONSOLE builds in the serial command console, see src/FurbleConsole.cpp.
; Without an explicit path PlatformIO generates a fresh sdkconfig for each new
; environment name, so every variant points back at the sdkconfig of the board it
; extends. Only the compiler flags differ.
[env:m5stick-c-debug]
extends = env:m5stick-c
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stick-c
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:m5stick-c.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1

[env:m5stick-c-plus-debug]
extends = env:m5stick-c-plus
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stick-c-plus
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:m5stick-c-plus.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1

[env:m5stack-core-debug]
extends = env:m5stack-core
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stack-core
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:m5stack-core.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1

[env:m5stack-core2-debug]
extends = env:m5stack-core2
board_build.partitions = partitions_two_ota_16m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stack-core2
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:m5stack-core2.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1

[env:m5stick-s3-debug]
extends = env:m5stick-s3
board_build.partitions = partitions_two_ota_8m.csv
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.m5stick-s3
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/reproducible.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:m5stick-s3.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1
debug_tool = esp-builtin
debug_init_break = tbreak app_main

[env:waveshare-s3-eth-debug]
extends = env:waveshare-s3-eth
board_build.esp-idf.sdkconfig_path = ${platformio.src_dir}/../sdkconfig.waveshare-s3-eth
extra_scripts =
  pre:patches/version.py
  pre:patches/apply.py
  pre:patches/debug_sdkconfig.py
build_type = debug
build_flags = ${env:waveshare-s3-eth.build_flags} -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE -DFURBLE_CONSOLE=1
