name: FurbleCompanion

options:
  deploymentTarget:
    iOS: "16.0"
  macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  FurbleCompanionCoreIOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/FurbleCompanionCore
    settings:
      base:
        PRODUCT_MODULE_NAME: FurbleCompanionCore
        SWIFT_VERSION: "5.0"

  FurbleCompanionCoreMacOS:
    type: framework
    platform: macOS
    sources:
      - path: Sources/FurbleCompanionCore
    settings:
      base:
        PRODUCT_MODULE_NAME: FurbleCompanionCore
        SWIFT_VERSION: "5.0"

  FurbleCompanion-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/FurbleCompanionApp
      - path: AppResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FurbleCompanionCoreIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furble.companion.ios
        INFOPLIST_FILE: AppResources/iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: AppResources/iOS.entitlements
        SWIFT_VERSION: "5.0"

  FurbleCompanion-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/FurbleCompanionApp
      - path: AppResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: FurbleCompanionCoreMacOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furble.companion.macos
        INFOPLIST_FILE: AppResources/macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: AppResources/macOS.entitlements
        SWIFT_VERSION: "5.0"

  FurbleCompanionCoreTests-iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FurbleCompanionCoreTests
    dependencies:
      - target: FurbleCompanionCoreIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furble.companion.tests.ios
        SWIFT_VERSION: "5.0"

  FurbleCompanionCoreTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FurbleCompanionCoreTests
    dependencies:
      - target: FurbleCompanionCoreMacOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furble.companion.tests.macos
        SWIFT_VERSION: "5.0"

schemes:
  FurbleCompanion-iOS:
    build:
      targets:
        FurbleCompanion-iOS: all
        FurbleCompanionCoreTests-iOS: [test]
    test:
      targets:
        - FurbleCompanionCoreTests-iOS
    run:
      config: Debug

  FurbleCompanion-macOS:
    build:
      targets:
        FurbleCompanion-macOS: all
        FurbleCompanionCoreTests-macOS: [test]
    test:
      targets:
        - FurbleCompanionCoreTests-macOS
    run:
      config: Debug
